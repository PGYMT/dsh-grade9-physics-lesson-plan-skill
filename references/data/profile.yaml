version: 1
tested: 2026-10-27
# 跨课时不变的 7 条用户档案：SKILL 第 2 节读这里，不再抄一份。
# 本课时特有的（章节、课题、实验条件、学生用件）仍每次按需问，不写死在这里。
textbook: 人教版（2024）九年级物理全一册
duration_min: 40
experiment_mode: 仅多媒体
deliverables: 只出详案/逐字稿（1 份 md＋1 份 docx）
boards: 左板＝主干（全课不擦）、右板＝演算与错例（可空），共 1—2 块；每块 <=8 行、每行 <=14 字
placement: docx 放章节根级、md 放 md文件/；文件名「<节号><节名>-<课时标识>-<实验条件版本>-详案」（多课时用「第N课时」、单课时用「1课时」；练习课/讲评课用「<节号><节名>-练习课-详案」）；写文件前先问路：新建用 organize.py plan --dest，更新已有同名文件加 --update
research: 默认允许且必做；检索到的可用内容落地存 08-网络资源/（能下载的原件优先，不能下载的存正文快照 .md）
ask_each_time:
  - 源课件路径（.enbx）
  - 教材版本/章节
  - 课时数
  - 实验条件
  - 学生用件：有没有导学案/观察记录表？几页？谁印发？
  - 输出形式（默认 1 md＋1 docx）
  - 是否还要练习课/讲评课详案
  - 是否允许联网检索（默认允许；若明确不允许或网络不可用，须在教案“九、参考资料”注明本次未做网络调研及原因）
