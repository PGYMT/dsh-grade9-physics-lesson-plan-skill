# references/data/rubric.yaml — 网络资源评分口径的唯一数据源
# 由 07 的五类评分表迁移而来（2026-10-27 批二）。散文本仍写在 07，表格由 scripts/render_manuals.py 生成，勿手改本文件以外的渲染块。
version: 1
tested: 2026-10-17
gate:
  - no: 1
    name: 内容对应
    how: 看课题、知识点
    fail: 跨学段、跨学科，或知识点对不上本节
  - no: 2
    name: 可读可用
    how: 打开、从头翻到尾
    fail: 打不开、只有封面目录、扫描糊、乱码、水印遮正文、须付费才看全
  - no: 3
    name: 不重复
    how: 对已取文件
    fail: 与已取的同节同类材料实质相同（哈希前 16 位相同即算重复）
  - no: 4
    name: 科学性
    how: 抽 1 个知识点 + 1 道答案
    fail: 概念、公式、单位、结论、图示、答案出现错误
  - no: 5
    name: 非空壳
    how: 通读找具体细节
    fail: 无实质内容；或卡在机械线上
mechanical:
  floor:
    教案: 400
    课件: 400
    练习: 400
    导学案: 400
    板书参考: 100
  markers:
    - 教学目标
    - 学习目标
    - 教学过程
    - 教学重点
    - 教学难点
    - 重难点
    - 板书
    - 导学
    - 预习
    - 答案
    - 解析
    - 例题
    - 练习
    - 探究
    - 实验
    - 借鉴
    - 采用
    - 设计意图
kinds:
  - name: 教案
    full: 18
    dims:
      - no: 1
        name: 目标与重难点
        s0: 目标套话，难点写「内容较抽象」
        s1: 基本可测但笼统，重难点大体对
        s2: 可测，重难点与课堂实际相符，能看出为什么难
      - no: 2
        name: 讲授思路与顺序
        s0: 环节堆砌，看不出逻辑
        s1: 有顺序但按教材平推
        s2: 有清晰主线（先猜想后验证、先感后理）
      - no: 3
        name: 重点突破
        s0: 只写「教师重点讲解」
        s1: 有手段但笼统（「举例说明」）
        s2: 具体手段（对比实验、变式训练、当堂默写）
      - no: 4
        name: 难点突破
        s0: 只写「多讲几遍」「反复练习」
        s1: 提到方法但没展开
        s2: 有支架／模型／类比／分解（水压比电压、水流比电流）
      - no: 5
        name: 易错纠正
        s0: 无，或只写「注意易错点」
        s1: 点出错法但没纠正招
        s2: 点出典型错误＋纠正招
      - no: 6
        name: 板书设计
        s0: 无，或只写四个字
        s1: 只有标题罗列
        s2: 有结构有文字，一眼看出框架
      - no: 7
        name: 过渡语与提问链
        s0: 无，或全是「我们来看下一页」
        s1: 有过渡但机械
        s2: 有像真实课堂的话，问题具体
      - no: 8
        name: 练习与评价
        s0: 无题，或只有题没答案
        s1: 有题有答案，但不对易错
        s2: 有题有答案，且指向本节易错
      - no: 9
        name: 课堂细节完整度
        s0: 只有环节名
        s1: 有活动，无预设回答／时间
        s2: 有器材、预设回答、时间，改一改就能上
    bands:
      jia: 13
      jia_note: 关键维 1–5 无 0 分
      yi_min: 8
      yi_max: 12
      bing_max: 7
  - name: 课件
    full: 16
    dims:
      - no: 1
        name: 内容对应与覆盖
        s0: 缺关键知识点，或混入他节
        s1: 覆盖基本全，个别要点一笔带过
        s2: 与教材顺序一致，重点有专门页
      - no: 2
        name: 选题与例题
        s0: 整页照抄教材，或堆题
        s1: 有例题但一般
        s2: 例题典型、与本节目标对应
      - no: 3
        name: 信息密度与文字
        s0: 整页大段文字，或只有标题
        s1: 密度尚可但偏满
        s2: 一页一个要点，文字短
      - no: 4
        name: 图示与素材
        s0: 糊截图、图与内容不符
        s1: 图能看但不规范
        s2: 矢量／原生图形，清晰规范
      - no: 5
        name: 动画与答案呈现
        s0: 答案一上来就有，或满屏乱飞
        s1: 有动画但顺序不合理
        s2: 答案分步点出，顺序合理
      - no: 6
        name: 投影适配
        s0: 字太小，或对比度低
        s1: 基本能看，个别页偏小
        s2: 后排能看清
      - no: 7
        name: 教学逻辑线
        s0: 页序混乱，无过渡
        s1: 顺序基本对但无导航
        s2: 导入→探究→小结→练习，有导航
      - no: 8
        name: 可编辑与可复用
        s0: 图片拼版，无法编辑
        s1: 能改但结构乱（无母版）
        s2: 原生文字可改，有母版可套
    bands:
      jia: 12
      jia_note: 关键维 1 无 0 分
      yi_min: 7
      yi_max: 11
      bing_max: 6
    entry: 纯图片版、扫描版 PDF 不判死，但最高只能到乙（只能参考页序与选题，改不了字）。页眉课题、页序与本节明显对不上的，按通用第 1 条处理。
  - name: 练习
    full: 14
    dims:
      - no: 1
        name: 对应本节
        s0: 混入他节或超纲
        s1: 大部分对应，个别擦边
        s2: 全部落在本节范围
      - no: 2
        name: 题目质量
        s0: 有错题，或偏、怪、繁
        s1: 无错但平淡
        s2: 抽检全对且典型
      - no: 3
        name: 题型与层次
        s0: 全是选择题，或一上来就难题
        s1: 有层次但不明显
        s2: 概念形成→运用→拓展
      - no: 4
        name: 答案与解析
        s0: 无答案，或答案有错
        s1: 有答案没解析
        s2: 有答案有解析，易错题讲清
      - no: 5
        name: 题量与用时
        s0: 20 题以上整卷，或过少
        s1: 略多或略少
        s2: 3—5 题、5—10 分钟
      - no: 6
        name: 易错覆盖
        s0: 无
        s1: 有易错题但没指向
        s2: 有针对性的易错题
      - no: 7
        name: 来源与时效
        s0: 陈年旧题，来源不明
        s1: 常见教辅题
        s2: 教材课后题，或近年改编
    bands:
      jia: 11
      jia_note: 关键维 1、2 无 0 分
      yi_min: 6
      yi_max: 10
      bing_max: 5
    entry: 没答案不判死，但最高只能到乙，第 4 维记 0 分；整卷中高考原题同理，按「当堂练习」用途最高乙。既有口径：**习题 ≠ 试题**，当堂练习按知识点线性排列、以基础题为主，不用试卷「7∶2∶1」梯度；来源优先教材课后题与本地《金学典·同步优学》。
  - name: 导学案
    full: 14
    dims:
      - no: 1
        name: 与本节目标一致
        s0: 对不上本节目标
        s1: 大体一致，个别任务偏
        s2: 目标—任务—检测一条线
      - no: 2
        name: 栏目完整
        s0: 只有标题＋习题
        s1: 缺一两栏
        s2: 目标／预习／探究／当堂检测／作业齐全
      - no: 3
        name: 学生活动可操作
        s0: 全是「讨论一下」「思考」
        s1: 有填空但太笼统
        s2: 学生能直接动笔
      - no: 4
        name: 与课件教案配合
        s0: 各说各话
        s1: 内容相关但顺序对不上
        s2: 与课件页序对应
      - no: 5
        name: 难度与容量
        s0: 变成第二本练习册
        s1: 偏多，需要删
        s2: 一课时能完成
      - no: 6
        name: 版式可打印
        s0: 密不透风，无处落笔
        s1: 有留白但偏挤
        s2: 学生有地方写
      - no: 7
        name: 答案与教师版
        s0: 完全没有
        s1: 只有部分答案
        s2: 有完整答案或教师版
    bands:
      jia: 11
      jia_note: 关键维 1、3 无 0 分
      yi_min: 6
      yi_max: 10
      bing_max: 5
    entry: 只有「学习目标 + 习题」、没有学生活动栏或记录栏的，最高只能到乙；直接把教案改个标题的，按通用第 5 条（空壳）处理。
  - name: 板书参考
    full: 12
    dims:
      - no: 1
        name: 结构清晰
        s0: 杂乱无层次
        s1: 有结构但主次不清
        s2: 层次分明，关键字突出
      - no: 2
        name: 容量适当
        s0: 整段课文抄上黑板
        s1: 略超规格，需压缩
        s2: 落在 1—2 块／≤8 行／≤14 字内
      - no: 3
        name: 关键词精炼
        s0: 整句整段
        s1: 半句半词
        s2: 关键词、符号、箭头
      - no: 4
        name: 生成时机
        s0: 只有最终成品图，不知何时写
        s1: 提到时机但不完整
        s2: 标出书写时机与顺序
      - no: 5
        name: 与本节重点一致
        s0: 面面俱到没重点
        s1: 有重点但被细节淹没
        s2: 抓住重点，敢于留白
      - no: 6
        name: 可读性
        s0: 糊、挤、看不清
        s1: 能看但排版差
        s2: 字体清楚、留白合理
    bands:
      jia: 10
      jia_note: 关键维 1、3、5 无 0 分
      yi_min: 5
      yi_max: 9
      bing_max: 4
    entry: 只有「板书设计」四个字、或纯文字说明没有成品的，直接不可用；图片糊到看不清结构的，直接不可用。
